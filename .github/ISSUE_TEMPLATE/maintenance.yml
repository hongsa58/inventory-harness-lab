name: 유지보수 작업

description: 기존 기능의 수정·개선·리팩터링을 요청합니다.
title: "[Maintenance] "
labels:
  - maintenance
body:
  - type: markdown
    attributes:
      value: |
        ## 유지보수 작업 계약서

        아래 항목을 작성한 뒤 작업을 시작합니다. 원본 문서와 충돌하거나
        사람의 판단이 필요한 내용은 추측하지 말고 `NEEDS_HUMAN`으로 남깁니다.

  - type: textarea
    id: background
    attributes:
      label: 1. 배경
      description: 문제와 관련 사용자·화면·Issue·원본 문서를 적어주세요.
      placeholder: |
        왜 필요한가요?
        관련 링크:
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 2. 변경 범위
      description: 바꿀 것, 기대 동작, 바꾸지 않을 것을 적어주세요.
      placeholder: |
        변경:
        기대 동작:
        제외:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 3. 완료 조건
      description: 명령·입력·기대 결과·실패 기준을 수치와 함께 적어주세요.
      placeholder: |
        [ ] 명령/행동:
            입력/기준:
            기대 결과:
            실패 기준:

        관련 요구사항 또는 원본 문서 섹션:
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 4. 검증 방법
      description: 각 완료 조건에 대응하는 테스트 파일과 실행 명령을 연결해 주세요.
      placeholder: |
        전체 검증: npm run verify

        Issue 테스트(필요한 경우):
        - 파일: tests/issues/issue-{번호}-{기능명}.test.ts
        - 실행: npx vitest run tests/issues/issue-{번호}-{기능명}.test.ts
        - 대상 완료 조건:

        추가 검증:
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: 5. 제약과 금지 사항
      description: 반드시 지킬 경계나 변경하면 안 되는 계약을 적어주세요.
      placeholder: |
        예: 재고 변경은 src/lib/stock.ts의 applyMovement()만 사용한다.
        예: 기존 API·화면 계약은 변경하지 않는다.
    validations:
      required: true

  - type: input
    id: max-retries
    attributes:
      label: 6. 구현 루프 최대 횟수
      description: 구현→검증 사이클의 최대 횟수입니다. 기본 3회이며 초과 시 NEEDS_HUMAN으로 전환합니다.
      value: "3"
      placeholder: "예: 3 (계속·무제한은 입력하지 않음)"
    validations:
      required: true

  - type: dropdown
    id: source-routing
    attributes:
      label: 먼저 확인할 원본 문서
      description: AGENTS.md의 라우팅에 따라 하나를 선택하세요.
      options:
        - docs/01-requirements.md — 요구사항
        - docs/06-architecture.md — 기술 구조·계약
        - docs/HANDOVER.md — 현재 상태
        - docs/07-plan.md — 마일스톤·QA
        - docs/05-design.md — 화면·접근성
        - docs/harness/01-ssot.md — 문서 권위·충돌
        - docs/harness/02-verification.md — 검증 규칙
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: 작업 시작 전 확인
      options:
        - label: 원본 문서와 현재 구현을 확인했습니다.
          required: true
        - label: 충돌이나 판단이 필요한 내용은 NEEDS_HUMAN으로 남기겠습니다.
          required: true
        - label: 보호 경로 변경 시 docs/harness/01-ssot.md의 승인 정책을 따르겠습니다.
          required: true
